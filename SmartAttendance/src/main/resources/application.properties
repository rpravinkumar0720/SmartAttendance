spring.application.name=SmartAttendence

# ===== MySQL Database =====
# Create the database first: CREATE DATABASE smart_attendance;
spring.datasource.url=jdbc:mysql://localhost:3306/smartattendance
spring.datasource.username=root
spring.datasource.password=sql123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== File upload (base64 face descriptors can be large) =====
