<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance | Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="center-screen">
    <div class="glass auth-standalone">
      <div class="brand" style="margin-bottom:12px;">
        <div class="logo">SA</div>
        <div>
          <h1>Smart Attendance</h1>
          <span class="brand-subtitle">Account Recovery</span>
        </div>
      </div>
      <span class="eyebrow" style="margin-top:12px;">Reset Password</span>
      <p class="subtitle">Enter your registered email address to receive a one-time verification code.</p>

      <div class="error-msg" th:if="${error}" th:text="${error}"></div>
      <div class="success-msg" th:if="${success}" th:text="${success}"></div>

      <form th:action="@{/forgot-password}" method="post">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@college.edu" required autofocus autocomplete="email">

        <button type="submit" class="btn btn-primary btn-block">Send OTP Code</button>
      </form>

      <p class="status-text">
        Remembered it after all? <a th:href="@{/login}">Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
