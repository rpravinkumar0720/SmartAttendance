<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance | Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="center-screen">
    <div class="glass auth-standalone">
      <div class="brand" style="margin-bottom:12px;">
        <div class="logo">SA</div>
        <div>
          <h1>Smart Attendance</h1>
          <span class="brand-subtitle">Security</span>
        </div>
      </div>
      <span class="eyebrow" style="margin-top:12px;">New Password</span>
      <p class="subtitle">Choose a new, strong password with at least 6 characters.</p>

      <div class="error-msg" th:if="${error}" th:text="${error}"></div>
      <div class="success-msg" th:if="${success}" th:text="${success}"></div>

      <form th:action="@{/reset-password}" method="post">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autofocus autocomplete="new-password">

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">

        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>
    </div>
  </div>
</body>
</html>
